<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX — Laboratório cinematográfico</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#080407;color:#f4d6ae;font-family:Georgia,serif}main{height:430vh}.screen{height:100svh;position:sticky;top:0;overflow:hidden;background:#080407}.scene{position:absolute;inset:0;background-position:center;background-size:contain;background-repeat:no-repeat;background-color:#080407;will-change:transform,opacity;opacity:0;transform:scale(1)}.scene:before{content:'';position:absolute;inset:0;background:inherit;background-size:cover;filter:blur(45px) brightness(.35);transform:scale(1.07);z-index:-1}.scene:nth-child(1){background-image:url('assets/cena-1.webp');opacity:1}.scene:nth-child(2){background-image:url('assets/cena-2.webp')}.scene:nth-child(3){background-image:url('assets/cena-3.webp')}.scene:nth-child(4){background-image:url('assets/cena-4.webp')}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#080409ba,transparent 85%),linear-gradient(0deg,#080407aa,transparent 50%)}.light{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse at 70% 65%,#f23b184d,transparent 46%);mix-blend-mode:screen;animation:pulse 6s ease-in-out infinite alternate}.top{position:absolute;z-index:10;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px 5vw;font:600 11px system-ui;letter-spacing:.15em}.top strong{font:normal 32px Georgia;color:#e6b475;letter-spacing:.18em}.top a{color:#e6c7a8;text-decoration:none;border:1px solid #9d775b;padding:10px 14px}.copy{position:absolute;z-index:6;bottom:13%;left:7%;max-width:660px;text-shadow:0 5px 25px #000}.copy small{font:700 11px system-ui;letter-spacing:.28em;color:#eab08b}.copy h1{font-size:clamp(45px,8vw,110px);line-height:.98;margin:12px 0 18px}.copy p{font:16px/1.7 system-ui;max-width:470px}.progress{position:absolute;bottom:0;left:0;height:3px;background:#d66c35;width:0;z-index:20}.hint{position:absolute;bottom:30px;right:5vw;font:11px system-ui;letter-spacing:.15em}.ember{position:absolute;width:3px;height:3px;border-radius:50%;background:#f7954b;box-shadow:0 0 12px #f95b22;animation:rise linear infinite;pointer-events:none}.embers{position:absolute;inset:0;pointer-events:none}.label{position:absolute;top:95px;right:5vw;font:10px system-ui;letter-spacing:.12em;color:#ead2bf}.fallback{position:absolute;z-index:30;bottom:10px;left:5vw;font:10px system-ui;color:#dec2a4}@keyframes pulse{from{opacity:.16;transform:scale(1)}to{opacity:.55;transform:scale(1.13)}}@keyframes rise{from{transform:translateY(15vh);opacity:0}20%{opacity:.7}to{transform:translateY(-110vh);opacity:0}}@media(max-width:700px){.scene{background-position:center center;background-size:contain}.copy{left:6%;right:6%;bottom:18%}.copy p{font-size:13px}.top{padding:18px 5vw}.top strong{font-size:25px}}@media(prefers-reduced-motion:reduce){.ember,.light{animation:none}}
</style></head><body><main id="stage"><div class="screen"><div class="scene" id="s0"></div><div class="scene" id="s1"></div><div class="scene" id="s2"></div><div class="scene" id="s3"></div><div class="light"></div><div class="veil"></div><div class="embers" id="embers"></div><header class="top"><strong>APEX</strong><a href="index.html">SITE PRINCIPAL</a></header><div class="label">LABORATÓRIO CINEMATOGRÁFICO · IMAGENS INTEIRAS</div><section class="copy" aria-live="polite"><small id="eyebrow">CAPÍTULO I · O DESPERTAR</small><h1 id="title">A lenda<br>desperta.</h1><p id="desc">O guardião da APEX desperta nas sombras de um novo reino.</p></section><div class="hint">ROLE PARA EXPLORAR ↓</div><div class="progress" id="progress"></div></div></main><script>
const scenes=[0,1,2,3].map(i=>document.getElementById('s'+i)),stage=document.getElementById('stage'),text=[['CAPÍTULO I · O DESPERTAR','A lenda<br>desperta.','O guardião da APEX desperta nas sombras de um novo reino.'],['CAPÍTULO II · O TERRITÓRIO','Um reino.<br>Um legado.','Entre fortalezas e montanhas, nasce uma nova história.'],['CAPÍTULO III · A UNIÃO','Nossa força<br>é a guild.','Respeito, companheirismo e a vontade de crescer juntos.'],['CAPÍTULO IV · A ASCENSÃO','Nós somos<br>APEX.','O próximo capítulo começa com você.']];let current=-1,mx=0,my=0;const clamp=x=>Math.max(0,Math.min(1,x));addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});function render(){let p=clamp(scrollY/Math.max(1,stage.offsetHeight-innerHeight));for(let i=0;i<4;i++){let delta=p*3-i,fade=clamp(1-Math.max(0,Math.abs(delta)-.20)/.80);scenes[i].style.opacity=fade;scenes[i].style.transform='translate3d('+(delta*-.4+mx*.08)+'%,'+(delta*.35+my*.08)+'%,0) scale('+(1.015-Math.min(1,Math.abs(delta))*.008)+')'}let i=Math.min(3,Math.floor(p*4));if(i!==current){current=i;document.getElementById('eyebrow').textContent=text[i][0];document.getElementById('title').innerHTML=text[i][1];document.getElementById('desc').textContent=text[i][2]}document.getElementById('progress').style.width=(p*100)+'%'}addEventListener('scroll',render,{passive:true});addEventListener('resize',render);render();setInterval(render,60);const em=document.getElementById('embers');for(let i=0;i<32;i++){let e=document.createElement('i');e.className='ember';e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';e.style.animationDuration=(5+Math.random()*9)+'s';e.style.animationDelay=(-Math.random()*12)+'s';em.append(e)}
</script></body></html>
