const emblem=new THREE.Group();scene.add(emblem);emblem.position.set(5,-.4,-1);const bar=(x,y,z,w,h,rot)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.42),gold);m.position.set(x,y,z);m.rotation.z=rot;m.castShadow=true;emblem.add(m)};bar(-.8,0,0,.42,3.5,-.46);bar(.8,0,0,.42,3.5,.46);bar(0,-.35,.1,1.65,.35,0);const jewel=new THREE.Mesh(new THREE.OctahedronGeometry(.27),new THREE.MeshStandardMaterial({color:0xc51323,emissive:0x65000b,emissiveIntensity:.7,metalness:.35,roughness:.18}));jewel.position.set(0,.45,.35);emblem.add(jewel);
// Névoa volumétrica simulada em camadas transparentes.
const hazeMat=new THREE.MeshBasicMaterial({color:0x5a1c23,transparent:true,opacity:.095,depthWrite:false,side:THREE.DoubleSide});
const haze=[];for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(22,4),hazeMat.clone());m.position.set((i%3-1)*4,-2+i*.34,-3-i*.6);m.rotation.x=-.17;m.material.opacity=.035+(i%3)*.026;scene.add(m);haze.push(m)}
// Partículas de impacto reveladas apenas no pouso.
const impactGeometry=new THREE.BufferGeometry(),impactPoints=[],impactVectors=[];
for(let i=0;i<110;i++){const a=i*2.399963,spread=.3+(i%17)/17*2.3;impactPoints.push(0,0,0);impactVectors.push(Math.cos(a)*spread,(i%11)/11*1.6,Math.sin(a)*spread)}
impactGeometry.setAttribute('position',new THREE.Float32BufferAttribute(impactPoints,3));
const impact=new THREE.Points(impactGeometry,new THREE.PointsMaterial({color:0xe0a45e,size:.07,transparent:true,opacity:0,depthWrite:false}));
impact.position.set(5,-1.9,1);scene.add(impact);
const particles=new THREE.BufferGeometry(),pts=[];for(let i=0;i<200;i++)pts.push((Math.random()-.5)*34,(Math.random()-.5)*15,(Math.random()-.5)*15);particles.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(particles,new THREE.PointsMaterial({color:0xf4552e,size:.05,transparent:true,opacity:.65})));

// Atmosfera tridimensional dinâmica: brasas em movimento e luz de lava pulsante.
const emberCount=240,emberPositions=new Float32Array(emberCount*3),emberSpeeds=new Float32Array(emberCount);
for(let i=0;i<emberCount;i++){emberPositions[i*3]=(Math.random()-.5)*26;emberPositions[i*3+1]=-3+Math.random()*12;emberPositions[i*3+2]=-9+Math.random()*13;emberSpeeds[i]=.13+Math.random()*.5}
const emberGeometry=new THREE.BufferGeometry();emberGeometry.setAttribute('position',new THREE.BufferAttribute(emberPositions,3));
const emberCloud=new THREE.Points(emberGeometry,new THREE.PointsMaterial({color:0xff6738,size:.055,transparent:true,opacity:.8,depthWrite:false,sizeAttenuation:true}));scene.add(emberCloud);
const lavaLights=[];
for(const [x,z,power] of [[-5,-1.4,18],[0,-2,13],[4,-.6,17]]){const light=new THREE.PointLight(0xe33318,power,9);light.position.set(x,-3.15,z);scene.add(light);lavaLights.push(light)}

const stage=document.getElementById('stage'),clock=new THREE.Clock(),reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;let progress=0,displayProgress=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=v=>{v=clamp(v,0,1);return v*v*(3-2*v)};
function update(){progress=clamp(scrollY/Math.max(1,stage.offsetHeight-innerHeight),0,1);scrollHint.style.opacity=progress>.22?'0':'1'}
addEventListener('scroll',update,{passive:true});update();
// Controles alternativos sem alterar a cena 3D validada: setas, Page Up/Down, Home e End.
addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
 if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
 const step=innerHeight*.68;
 let target=null;
 if(event.key==='ArrowDown'||event.key==='PageDown')target=scrollY+step;
 else if(event.key==='ArrowUp'||event.key==='PageUp')target=scrollY-step;
 else if(event.key==='Home')target=0;
 else if(event.key==='End')target=stage.offsetHeight-innerHeight;
 if(target===null)return;
 event.preventDefault();
 scrollTo({top:Math.max(0,Math.min(target,stage.offsetHeight-innerHeight)),behavior:reducedMotion?'instant':'smooth'});
});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;displayProgress+=(progress-displayProgress)*Math.min(1,dt*(reducedMotion?20:7));if(dragonMixer){dragonMixer.update(0);if(dragonClip){const duration=dragonClip.getClip().duration;if(duration>0){dragonClip.paused=true;dragonClip.time=displayProgress*duration;dragonMixer.setTime(dragonClip.time)}}}const lift=ease((displayProgress-.10)/.24),cruise=ease((displayProgress-.30)/.48),settle=ease((displayProgress-.78)/.18),flight=lift*(1-settle);
dragon.position.set(-3+cruise*8,-.25+lift*4.8-settle*3.1+(reducedMotion?0:Math.sin(displayProgress*23)*.08*flight),1);
dragon.rotation.set(-.03*lift,.03+cruise*.16+(reducedMotion?0:Math.sin(displayProgress*7)*.035*flight),(-.06*lift+.09*cruise)*(1-settle));dragon.scale.setScalar(1-settle*.18);
// Batimento contínuo durante o voo; a rolagem determina a fase narrativa.
const flapPhase=t*(2.2+flight*3.1);
const flap=(reducedMotion?0:Math.sin(flapPhase))*(.035+flight*.54)*(1-settle);
left.rotation.x=.22+flap;right.rotation.x=-.22-flap;
left.rotation.z=-.07+lift*.14-settle*.2;right.rotation.z=-.07+lift*.14-settle*.2;
left.rotation.y=lift*.08;right.rotation.y=-lift*.08;
tail.rotation.z=reducedMotion?0:Math.sin(t*1.8)*(.04+flight*.14);tail.rotation.y=reducedMotion?0:Math.sin(t*1.3)*(.035+flight*.12);emblem.rotation.y=reducedMotion?0:Math.sin(displayProgress*3)*.035;
const mobile=innerWidth<700;camera.position.x=cruise*5.0;camera.position.y=5+lift*.45-settle*.3;camera.position.z=mobile?25:19;camera.lookAt(cruise*4.0,settle*.1,0);const burst=ease((displayProgress-.77)/.035)*(1-ease((displayProgress-.85)/.11));
impact.material.opacity=burst*.7;
const impactArray=impactGeometry.attributes.position.array;
for(let i=0;i<impactVectors.length/3;i++){const p=i*3;impactArray[p]=impactVectors[p]*burst;impactArray[p+1]=impactVectors[p+1]*burst-.55*burst*burst;impactArray[p+2]=impactVectors[p+2]*burst}
impactGeometry.attributes.position.needsUpdate=true;
const reveal=ease((displayProgress-.9)/.09);actions.style.opacity=reveal;actions.style.pointerEvents=reveal>.95?'auto':'none';actions.setAttribute('aria-hidden',reveal>.95?'false':'true');red.intensity=55+10*Math.sin(displayProgress*6);
const time=clock.elapsedTime;
for(let i=0;i<emberCount;i++){const k=i*3;emberPositions[k+1]+=emberSpeeds[i]*Math.min(dt,.05);emberPositions[k]+=.0012*Math.sin(time*.7+i);if(emberPositions[k+1]>9){emberPositions[k+1]=-3.1;emberPositions[k]=(Math.random()-.5)*26}}emberGeometry.attributes.position.needsUpdate=true;
for(let i=0;i<lavaLights.length;i++)lavaLights[i].intensity=(12+i*2)*(1+.17*Math.sin(time*1.4+i*1.8));for(let i=0;i<haze.length;i++)haze[i].position.x=Math.sin(displayProgress*3+i)*.7+(i%3-1)*4;renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?48:38;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75))});
}catch(e){document.getElementById('error').style.display='grid';console.error(e)}

// Narrativa cinematográfica sincronizada com a cena 3D existente.
const intro=document.getElementById('apexIntro'),chapter=document.getElementById('apexChapter');
const chapterIndex=document.getElementById('apexChapterIndex'),chapterTitle=document.getElementById('apexChapterTitle'),chapterText=document.getElementById('apexChapterText');
const chapters=[['CAPÍTULO I','O despertar','O guardião observa seu território.'],['CAPÍTULO II','A ascensão','O dragão conquista os céus.'],['CAPÍTULO III','O domínio','Entre montanhas e fortalezas, nasce um legado.'],['CAPÍTULO IV','A APEX','Seu lugar entre os nossos começa aqui.']];
let currentChapter=-1;
function updateNarrative(){const p=Math.max(0,Math.min(1,scrollY/Math.max(1,stage.offsetHeight-innerHeight)));intro.style.opacity=String(1-Math.min(1,p/.13));const visible=Math.min(1,Math.max(0,(p-.10)/.12));chapter.style.opacity=String(visible*(1-Math.max(0,(p-.90)/.08)));const index=Math.min(3,Math.floor(p*4));if(index!==currentChapter){currentChapter=index;chapterIndex.textContent=chapters[index][0];chapterTitle.textContent=chapters[index][1];chapterText.textContent=chapters[index][2]}}
addEventListener('scroll',updateNarrative,{passive:true});addEventListener('resize',updateNarrative);updateNarrative();
// Áudio opcional, sintetizado localmente após gesto do visitante.
const soundButton=document.getElementById('apexSound');let audioContext=null,drone=null,droneGain=null;
soundButton.addEventListener('click',async()=>{try{if(!audioContext){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){soundButton.textContent='SOM INDISPONÍVEL';return}audioContext=new AC();drone=audioContext.createOscillator();drone.type='sine';drone.frequency.value=55;droneGain=audioContext.createGain();droneGain.gain.value=0;drone.connect(droneGain).connect(audioContext.destination);drone.start()}await audioContext.resume();const enabled=soundButton.getAttribute('aria-pressed')!=='true';droneGain.gain.setTargetAtTime(enabled?.018:0,audioContext.currentTime,.12);soundButton.setAttribute('aria-pressed',String(enabled));soundButton.textContent=enabled?'SOM LIGADO':'SOM DESLIGADO'}catch(e){soundButton.textContent='SOM INDISPONÍVEL'}});
</script></body></html>
