<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b0e"><meta name="description" content="APEX — Uma guild, um legado."><title>APEX | A Ascensão do Dragão</title><link rel="preload" href="assets/cena-1.webp" as="image"><style>
:root{color-scheme:dark;--gold:#e5b75d;--red:#c52424;--ink:#0b080b}*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:var(--ink);color:#fff;font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}.stage{height:520vh;position:relative}.viewport{position:sticky;top:0;height:100svh;overflow:hidden;background:#11080b}.scene{position:absolute;inset:-5%;background-size:cover;background-position:center;opacity:0;transform:scale(1.14);will-change:transform,opacity;filter:contrast(1.06) saturate(1.08)}.scene:nth-child(1){background-image:url('assets/cena-1.webp')}.scene:nth-child(2){background-image:url('assets/cena-2.webp')}.scene:nth-child(3){background-image:url('assets/cena-3.webp')}.scene:nth-child(4){background-image:url('assets/cena-4.webp')}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.48),transparent 28%,transparent 57%,rgba(0,0,0,.76));pointer-events:none}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 18vw rgba(0,0,0,.65);pointer-events:none}.embers{position:absolute;inset:0;pointer-events:none;overflow:hidden}.ember{position:absolute;width:3px;height:3px;border-radius:50%;background:#ff6b29;box-shadow:0 0 12px 3px #f34a17;animation:float linear infinite;opacity:.65}@keyframes float{from{transform:translateY(110vh) translateX(0);opacity:0}15%{opacity:.7}to{transform:translateY(-20vh) translateX(50px);opacity:0}}header{position:absolute;z-index:5;top:0;left:0;right:0;padding:22px clamp(20px,5vw,75px);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#0008,transparent)}.brand{font-size:clamp(24px,3vw,38px);font-weight:bold;color:var(--gold);letter-spacing:.22em;text-shadow:0 0 20px #b42320}header span{font:11px system-ui,sans-serif;letter-spacing:.22em;color:#e9d6bd}.end{position:absolute;z-index:6;bottom:9%;left:50%;width:min(94%,760px);transform:translateX(-50%);text-align:center;opacity:0;pointer-events:none}.links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.links a{font:700 15px system-ui,sans-serif;letter-spacing:.03em;text-decoration:none;color:#fff;padding:17px 24px;border:1px solid #d9ac5b;border-radius:6px;background:linear-gradient(130deg,#164e30,#0b281d);box-shadow:0 6px 28px #0009}.links a.discord{background:linear-gradient(130deg,#4c55bb,#22265e)}.links a:hover{filter:brightness(1.3);transform:translateY(-2px)}.links a.disabled{opacity:.65}@media(max-width:650px){.scene{background-position:center}.end{bottom:13%}.links a{width:min(90%,300px)}header span{font-size:9px;letter-spacing:.08em}}@media(prefers-reduced-motion:reduce){.ember{animation:none}.scene{transform:none!important}.end{transition:none}}
</style></head><body><main class="stage" id="stage"><section class="viewport" aria-label="Experiência cinematográfica APEX"><div class="scene"></div><div class="scene"></div><div class="scene"></div><div class="scene"></div><div class="shade"></div><div class="vignette"></div><div class="embers" id="embers"></div><header><div class="brand">APEX</div><span>UMA GUILD, UM LEGADO</span></header><div class="end" id="end"><div class="links"><a id="whatsapp" href="#" aria-label="Link do WhatsApp ainda não configurado">WhatsApp</a><a class="discord" id="discord" href="#" aria-label="Link do Discord ainda não configurado">Discord</a></div></div></section></main><script>
// CONFIGURE OS LINKS REAIS AQUI:
const LINKS={whatsapp:'',discord:''};
for(const key of ['whatsapp','discord']){const a=document.getElementById(key);if(LINKS[key]){a.href=LINKS[key];a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','Entrar no '+key)}else{a.classList.add('disabled');a.addEventListener('click',e=>{e.preventDefault();alert('O link do '+key+' ainda não foi configurado.')})}}
const scenes=[...document.querySelectorAll('.scene')],stage=document.getElementById('stage'),end=document.getElementById('end');let raf=false;function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function render(){raf=false;const max=stage.offsetHeight-innerHeight;const p=clamp((scrollY-stage.offsetTop)/max,0,1),t=p*3;scenes.forEach((s,i)=>{const distance=Math.abs(t-i);s.style.opacity=clamp(1-distance,0,1);s.style.transform=`scale(${1.08-distance*.025+(p*.04)}) translateY(${(i-t)*1.4}%)`});const reveal=clamp((p-.79)/.16,0,1);end.style.opacity=reveal;end.style.pointerEvents=reveal>.9?'auto':'none'}function tick(){if(!raf){raf=true;requestAnimationFrame(render)}}addEventListener('scroll',tick,{passive:true});addEventListener('resize',tick);render();const embers=document.getElementById('embers');for(let i=0;i<24;i++){let e=document.createElement('i');e.className='ember';e.style.left=((i*43.7)%100)+'%';e.style.animationDuration=(7+i%9)+'s';e.style.animationDelay=-(i*1.13)+'s';embers.append(e)}
</script></body></html>
